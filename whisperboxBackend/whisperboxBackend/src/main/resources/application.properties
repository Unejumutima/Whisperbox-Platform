spring.application.name=whisperboxBackend
# SERVER
server.port=8080

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5433/whisperboxplatform
spring.datasource.username=postgres
spring.datasource.password=ikirezi
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# GOOGLE OAUTH2 (Replace with your actual credentials from Google Cloud Console)
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ALLOWED SCHOOL DOMAIN (Only emails from this domain can access)
app.allowed.domain=@yourschool.edu

# JWT SECRET (In production, use a strong secret and store it securely)
jwt.secret=mySecretKeyForWhisperboxPlatformAuthenticationSystemChangeThisInProduction
jwt.expiration=86400000

# FRONTEND URL (where to redirect after successful login)
app.frontend.url=http://localhost:3000
